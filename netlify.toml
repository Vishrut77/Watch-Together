# Frontend only. The FastAPI backend and the LiveKit media server run elsewhere (see README).
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_BASE_URL in Netlify -> Site settings -> Environment variables
  # (e.g. https://your-backend.onrender.com). No trailing slash.

# Single-page app: /room/ABC123 must serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), autoplay=(self), fullscreen=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
